# Render Blueprint for CLIProxyAPI + mirasim plugin baked into the image.
#
# Render -> New -> Blueprint -> select this repo. Render always builds
# ./Dockerfile (the Blueprint spec has no dockerfilePath field), so the
# plugin-enabled Dockerfile IS ./Dockerfile here; the pristine upstream
# image definition is kept as Dockerfile.upstream for reference.
#
# Build arg MIRASIM_VERSION pins the plugin release. Bump it together
# with the .so release on Fim98/cpa-plugin-mirasim (fork of KIDA-MNESIA).
services:
  - type: web
    name: cpa
    runtime: docker
    dockerBuildArgs:
      MIRASIM_VERSION: "1.3.0"
    # Health check against the root path; verify /v0/management/plugins
    # manually after deploy (needs the management key).
    healthCheckPath: /
    # CPA listens on $PORT via deploy/entrypoint.sh; the default here is
    # only a fallback when Render does not inject PORT.
    envVars:
      - key: PORT
        value: 8317
      - key: DEPLOY
        value: ""
      # Set these in Render Dashboard -> Environment (secret values!):
      # - MANAGEMENT_KEY: bearer key for /v0/management/* (required)
      # - API_KEY:        key your clients send to CPA (required)
      # Persistence (pick ONE when login drops become painful):
      # - PGSTORE_DSN:    postgresql://user:pass@host:5432/cliproxy
      # - PGSTORE_SCHEMA: public
      - key: MANAGEMENT_KEY
        sync: false
      - key: API_KEY
        sync: false
